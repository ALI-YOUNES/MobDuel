version: "3.9"

# Optional: spins up a local PostgreSQL for development.
# Usage: docker compose up -d
services:
  db:
    image: postgres:16-alpine
    container_name: mobduel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mobduel
      POSTGRES_PASSWORD: mobduel
      POSTGRES_DB: mobduel
    ports:
      - "5432:5432"
    volumes:
      - mobduel_pgdata:/var/lib/postgresql/data

volumes:
  mobduel_pgdata:
